<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:512px; height:512px; }
  body {
    background:#0B0E12;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;
    position:relative; overflow:hidden;
  }
  .glow {
    position:absolute; width:520px; height:520px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,106,60,0.18) 0%, rgba(255,106,60,0) 64%);
    top:-190px; right:-170px;
  }
  .mark {
    position:relative; z-index:2;
    font-size:108px; font-weight:800; letter-spacing:-4px;
    color:#F4EFE5; line-height:1;
  }
  .mark .v { color:#FF6A3C; }
  .rule {
    position:relative; z-index:2;
    width:132px; height:3px; background:#FF6A3C;
    margin:26px 0 22px;
  }
  .sub {
    position:relative; z-index:2;
    font-size:21px; font-weight:700; letter-spacing:5.2px;
    color:#8A8F98; text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="mark">AIS<span class="v">.152</span></div>
  <div class="rule"></div>
  <div class="sub">München</div>
</body>
</html>
